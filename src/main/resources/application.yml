spring:
  application:
    name: digital-signature

  profiles:
    active: dev

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

application:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-this-in-production-min-256-bits-long-enough-for-hs256}
    expiration: 3600000 # 1 hour in milliseconds
    refresh-expiration: 604800000 # 7 days in milliseconds

  file-storage:
    upload-dir: ./uploads
    max-file-size: 10485760 # 10MB in bytes

  auth:
    otp:
      registration-ttl-minutes: 10
      login-2fa-ttl-minutes: 5
      temp-password-ttl-minutes: 10
      code-length: 6
      max-attempts: 5
      resend-cooldown-seconds: 60
    mail:
      from: ${MAIL_FROM:no-reply@digital-signature.local}
      app-name: "Digital Signature"
      enabled: ${MAIL_ENABLED:true}

ca:
  keystore-path: ${CA_KEYSTORE_PATH:./uploads/.ca/ca.p12}
  keystore-password: ${CA_KEYSTORE_PASSWORD:dev-ca-password-change-me}
  root-cn: "Digital Signature Demo CA"
  root-validity-years: 10
  cert-validity-years: 2
  crl-distribution-url: ${CA_CRL_URL:http://localhost:8080/api/v1/ca/crl}

pades:
  output-dir: ${PADES_OUTPUT_DIR:./uploads/signed-pdf}

signature:
  backfill:
    enabled: ${SIGNATURE_BACKFILL_ENABLED:true}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
